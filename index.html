      setIndexing(false);
      return;

    fetch(GITHUB_RAW_INDEX_URL)
      .then(r => r.json())
      .then(data => {
        if (data.pages && data.pages.length > 0) setPageIndex(data.pages);
      })
      .catch(() => {})
      .finally(() => setIndexing(false));
  }, []);

  // Fuzzy-score pages against a query and return the top N most relevant.
  // Handles misspellings, partial words, and multi-word tags without any
  // hardcoded page IDs — safe to reuse across any site index.
  const scorePages = useCallback((index, query, topN = 20) => {
    if (!query || index.length <= topN) return index.slice(0, topN);

    const words = query.toLowerCase().trim().split(/\s+/).filter(w => w.length > 1);
    if (words.length === 0) return index.slice(0, topN);

    function fuzzyMatch(a, b) {
      if (a.includes(b) || b.includes(a)) return true;
      if (a.length >= 5 && b.length >= 5 && Math.abs(a.length - b.length) <= 2) {
        const [shorter, longer] = a.length <= b.length ? [a, b] : [b, a];
        let diff = 0;
        for (let i = 0; i < shorter.length; i++) {
          if (shorter[i] !== longer[i]) diff++;
          if (diff > 1) return false;
        }
        return true;
      }
      return false;
    }

    const scored = index.map(page => {
      const titleWords   = page.title.toLowerCase().split(/\s+/);
      const tagStr       = (page.tags || []).join(" ").toLowerCase();
      const tagWords     = tagStr.split(/\s+/);
      const excerptWords = (page.excerpt || "").toLowerCase().split(/\s+/);
      const contentWords = (page.content || "").toLowerCase().slice(0, 600).split(/\s+/);

      let score = 0;
      for (const qw of words) {
        if (titleWords.some(tw => fuzzyMatch(tw, qw)))   score += 10;
        if (tagWords.some(tw => fuzzyMatch(tw, qw)))     score += 8;
        if (tagStr.includes(qw))                         score += 5;
        if (excerptWords.some(tw => fuzzyMatch(tw, qw))) score += 4;
        if (contentWords.some(tw => fuzzyMatch(tw, qw))) score += 2;
      }
      return { page, score };
    });

    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, topN).map(s => s.page);
  }, []);

  const runSearch = useCallback(async (q) => {
    const trimmed = q.trim();
    if (!trimmed || loading) return;
    setLoading(true);
    setError(null);
    setResults(null);
    setSubmitted(trimmed);

    const systemPrompt = `You are an intelligent search agent for the CADI (Centre for Academic and Digital Innovation) website at the University of Portsmouth.

Given a staff member's search query, analyse the provided content index and return the most relevant results.

RULES:
- Understand intent: "cpd timetable" means they want the schedule of upcoming CPD sessions
- Expand abbreviations: ABL = Active Blended Learning, AIR = Assessment Information Resource, APEX = Academic Practice Enhancement, HEA = Higher Education Academy, etc.
- Prioritise the CPD and Support page for general CPD/professional development queries
- Consider partial matches, synonyms, and common misspellings
- Return 3–5 results, only those with relevance_score >= 35
- Note content gaps honestly when a topic has no coverage

Respond ONLY with valid JSON — no preamble, no markdown fences:
{
  "reasoning": "1–2 sentence explanation of how you interpreted this query",
  "results": [
    { "id": <number>, "relevance_score": <0–100>, "relevance_reason": "Why this matches (max 12 words)" }
  ],
  "content_gap": "Description of missing content if any, otherwise null",
  "suggestions": ["alternative query 1", "alternative query 2"]
}`;

    try {
      const endpoint = PROXY_URL.includes("YOUR-SUBDOMAIN")
        ? "https://api.anthropic.com/v1/messages"
        : PROXY_URL;

      const resp = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{
            role: "user",
            content: `Search query: "${trimmed}"\n\nContent index:\n${JSON.stringify(
              scorePages(pageIndex, trimmed).map(p => ({
                id: p.id, title: p.title, excerpt: p.excerpt,
                content: (p.content || "").slice(0, 400),
                type: p.type, tags: p.tags, date: p.date,
              })), null, 2
            )}`,
          }],
        }),
      });

      const data = await resp.json();
      if (data.error) throw new Error(data.error.message || "API error");

      const raw    = (data.content || []).find(b => b.type === "text")?.text || "{}";
      const clean  = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);

      const enriched = (parsed.results || [])
        .map(r => ({ ...pageIndex.find(p => p.id === r.id), ...r }))
        .filter(r => r.url)
        .sort((a, b) => b.relevance_score - a.relevance_score);

      const lq = trimmed.toLowerCase();
      const externalMatches = EXTERNAL_LINKS.filter(el =>
        el.keywords.some(k => lq.includes(k))
      );

      setResults({ ...parsed, results: enriched, externalMatches });
    } catch (e) {
      setError(
        PROXY_URL.includes("YOUR-SUBDOMAIN")
          ? "Demo mode: set PROXY_URL in index.html to your Cloudflare Worker URL to enable live search."
          : (e.message || "Search failed — please try again.")
      );
    } finally {
      setLoading(false);
    }
  }, [pageIndex, loading]);

      paddingTop: 2,
      fontFamily: "'Encode Sans Expanded', sans-serif",
    },
    cardTitle: {
      fontWeight: 700,
      fontSize: 15,
      color: T.text,
      fontFamily: "'Encode Sans Expanded', sans-serif",
    },
    cardExcerpt: {
      fontSize: 13,
      color: T.subtext,
      lineHeight: 1.6,
      marginTop: 5,
      marginBottom: 8,
    },
    gapBox: {
      marginTop: 20,
      padding: "14px 18px",
      background: "rgba(98,19,96,0.2)",
      border: `1px solid rgba(98,19,96,0.4)`,
      borderRadius: 8,
    },
    gapLabel: {
      fontSize: 10,
      color: "#D8A8D8",
      letterSpacing: 2,
      textTransform: "uppercase",
      marginBottom: 4,
      fontWeight: 700,
    },
    gapText: {
      fontSize: 13,
      color: T.subtext,
      lineHeight: 1.5,
    },
    suggestWrap: {
      marginTop: 16,
      display: "flex",
      flexWrap: "wrap",
      alignItems: "center",
      gap: 4,
    },
    suggestLabel: {
      fontSize: 12,
      color: T.muted,
    },
    suggestBtn: {
      background: "none",
      border: "none",
      color: C.secondary,
      fontSize: 13,
      cursor: "pointer",
      textDecoration: "underline",
      fontFamily: "'Open Sans', sans-serif",
      padding: "2px 4px",
    },
  };

  return (
    <div style={s.wrap}>

      {/* ── Header ── */}
      <header style={s.header}>
        <div className="header-accent" />
        <div style={s.logoMark}>C</div>
        <div>
          <div style={s.logoText}>CADI</div>
          <div style={s.logoSub}>Centre for Academic &amp; Digital Innovation</div>
        </div>
        <div style={s.divider} />
        <span style={s.headerLabel}>Agentic Search</span>
        <div style={s.badge}>Powered by Claude</div>
      </header>

      {/* ── Main ── */}
      <main style={s.main}>

        {/* Hero */}
        <p style={s.eyebrow}>University of Portsmouth</p>
        <h1 style={s.h1}>
          Find what you<br />
          <span style={s.h1Accent}>need to know</span>
        </h1>
        <p style={s.subtitle}>
          AI-powered search across CADI resources, CPD, events and tools
          {!GITHUB_RAW_INDEX_URL.includes("YOUR-ORG") && !indexing && (
            <span style={{ marginLeft: 10, fontSize: 11, color: "#4ade80", fontWeight: 600 }}>
              ● Live index ({pageIndex.length} pages)
            </span>
          )}
          {GITHUB_RAW_INDEX_URL.includes("YOUR-ORG") && (
            <span style={{ marginLeft: 10, fontSize: 11, color: C.secondary, fontWeight: 600 }}>
              ● Demo index
            </span>
          )}
        </p>

        {/* Search input */}
        <div style={s.inputWrap}>
          <input
            ref={inputRef}
            value={query}
            onChange={e => setQuery(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder="Try: fellowship, CPD timetable, peer observation…"
            style={s.input}
            onFocus={e => {
              e.target.style.borderColor = C.secondary;
              e.target.style.boxShadow = `0 0 0 3px rgba(0,160,255,0.15)`;
            }}
            onBlur={e => {
              e.target.style.borderColor = "rgba(0,160,255,0.3)";
              e.target.style.boxShadow = "none";
            }}
          />
          <button
            onClick={() => runSearch(query)}
            disabled={loading || indexing}
            style={s.searchBtn(loading || indexing)}
            onMouseEnter={e => { if (!loading && !indexing) e.currentTarget.style.opacity = "0.85"; }}
            onMouseLeave={e => { e.currentTarget.style.opacity = "1"; }}
          >
            {loading ? (
              <span style={{ display: "inline-block", width: 18, height: 18, border: `2.5px solid ${C.white}`, borderTopColor: "transparent", borderRadius: "50%", animation: "spin 0.7s linear infinite" }} />
            ) : (
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.white} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
            )}
          </button>
        </div>

        {/* Example prompts */}
        {!results && !loading && (
          <div style={s.chipWrap}>
            {EXAMPLE_PROMPTS.map(q => (
              <button key={q} onClick={() => { setQuery(q); runSearch(q); }}
                style={s.chip}
                onMouseEnter={e => {
                  e.target.style.background = `rgba(0,160,255,0.12)`;
                  e.target.style.borderColor = `rgba(0,160,255,0.4)`;
                  e.target.style.color = C.secondary;
                }}
                onMouseLeave={e => {
                  e.target.style.background = "rgba(0,0,0,0.25)";
                  e.target.style.borderColor = "rgba(255,255,255,0.1)";
                  e.target.style.color = T.muted;
                }}
              >{q}</button>
            ))}
          </div>
        )}

        {/* Loading */}
        {loading && (
          <div style={s.loadingWrap}>
            <div style={s.loadingText}>Searching {pageIndex.length} pages…</div>
            <div style={s.dotsWrap}>
              {[0,1,2].map(i => (
                <div key={i} style={{ width: 8, height: 8, borderRadius: "50%", background: C.secondary, animation: `bounce 1s ease-in-out ${i*0.15}s infinite` }} />
              ))}
            </div>
          </div>
        )}

        {/* Error */}
        {error && !loading && (
          <div style={s.errorBox}>
            ⚠ {error}
          </div>
        )}

        {/* Results */}
        {results && !loading && (
          <div style={s.resultsWrap}>

            {/* Meta bar */}
            <div style={s.metaBar}>
              <div>
                <span style={s.metaText}>Results for </span>
                <span style={s.metaQuery}>"{submitted}"</span>
                <span style={s.metaText}> — {results.results.length} match{results.results.length !== 1 ? "es" : ""}</span>
              </div>
              <button
                onClick={handleClear}
                style={s.clearBtn}
                onMouseEnter={e => { e.target.style.borderColor = "rgba(255,255,255,0.3)"; e.target.style.color = C.white; }}
                onMouseLeave={e => { e.target.style.borderColor = "rgba(255,255,255,0.15)"; e.target.style.color = T.muted; }}
              >Clear</button>
            </div>

            {/* AI reasoning */}
            {results.reasoning && (
              <div style={s.reasoningBox}>
                <span style={s.reasoningIcon}>✦</span>
                <div>
                  <div style={s.reasoningLabel}>AI Interpretation</div>
                  <div style={s.reasoningText}>{results.reasoning}</div>
                </div>
              </div>
            )}

            {/* External links */}
            {results.externalMatches?.length > 0 && (
              <div style={{ marginBottom: 20 }}>
                <div style={s.sectionLabel}>Direct Link</div>
                {results.externalMatches.map(el => (
                  <a key={el.url} href={el.url} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", display: "block" }}>
                    <div
                      style={s.externalCard}
                      onMouseEnter={e => { e.currentTarget.style.borderColor = `rgba(0,160,255,0.4)`; e.currentTarget.style.background = "rgba(0,160,255,0.07)"; }}
                      onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(255,255,255,0.12)"; e.currentTarget.style.background = "rgba(0,0,0,0.25)"; }}
                    >
                      <div>
                        <div style={s.externalTitle}>↗ {el.name}</div>
                        <div style={s.externalDesc}>{el.description}</div>
                      </div>
                      <div style={s.externalUrl}>{el.url.replace("https://","")}</div>
                    </div>
                  </a>
                ))}
              </div>
            )}

            {/* No results */}
            {results.results.length === 0 && (
              <div style={s.noResults}>No strong matches found for this query.</div>
            )}

            {/* Result cards */}
            <div style={s.cardList}>
              {results.results.map((r, idx) => {
                const tc = TYPE_CONFIG[r.type] || TYPE_CONFIG.page;
                const score = r.relevance_score;
                const scoreColor = score >= 80 ? "#4ade80" : score >= 60 ? C.secondary : T.muted;
                return (
                  <a key={r.id} href={r.url} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
                    <div
                      style={s.card}
                      onMouseEnter={e => {
                        e.currentTarget.style.borderColor = `rgba(0,160,255,0.35)`;
                        e.currentTarget.style.background = "rgba(0,160,255,0.05)";
                        e.currentTarget.style.transform = "translateY(-1px)";
                      }}
                      onMouseLeave={e => {
                        e.currentTarget.style.borderColor = "rgba(255,255,255,0.08)";
                        e.currentTarget.style.background = "rgba(0,0,0,0.2)";
                        e.currentTarget.style.transform = "none";
                      }}
                    >
                      <div style={s.cardNum}>{String(idx+1).padStart(2,"0")}</div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        {/* Title row */}
                        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
                          <span style={s.cardTitle}>{r.title}</span>
                          <span style={{
                            fontSize: 10, padding: "2px 9px", borderRadius: 10,
                            background: tc.bg, border: `1px solid ${tc.border}`,
                            color: tc.text, fontWeight: 700, letterSpacing: 0.5,
                            textTransform: "uppercase",
                          }}>{tc.label}</span>
                          {r.date && (
                            <span style={{ fontSize: 11, color: T.muted }}>
                              {new Date(r.date).toLocaleDateString("en-GB", { month: "short", year: "numeric" })}
                            </span>
                          )}
                        </div>

                        {/* Excerpt */}
                        <div style={s.cardExcerpt}>{r.excerpt}</div>

                        {/* Footer row */}
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 6 }}>
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                            {(r.tags || []).slice(0, 4).map(t => (
                              <span key={t} style={{
                                fontSize: 10, padding: "2px 8px", borderRadius: 6,
                                background: "rgba(255,255,255,0.05)",
                                border: "1px solid rgba(255,255,255,0.08)",
                                color: T.muted,
                              }}>{t}</span>
                            ))}
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <span style={{ fontSize: 11, color: T.muted, fontStyle: "italic" }}>{r.relevance_reason}</span>
                            <span style={{
                              fontSize: 12, fontWeight: 800, color: scoreColor,
                              fontFamily: "'Encode Sans Expanded', sans-serif",
                            }}>{score}%</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </a>
                );
              })}
            </div>

            {/* Content gap */}
            {results.content_gap && (
              <div style={s.gapBox}>
                <div style={s.gapLabel}>Content Gap Detected</div>
                <div style={s.gapText}>{results.content_gap}</div>
              </div>
            )}

            {/* Suggestions */}
            {results.suggestions?.length > 0 && (
              <div style={s.suggestWrap}>
                <span style={s.suggestLabel}>Try also: </span>
                {results.suggestions.map(sg => (
                  <button key={sg} onClick={() => { setQuery(sg); runSearch(sg); }}
                    style={s.suggestBtn}
                  >{sg}</button>
                ))}
              </div>
            )}

          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
